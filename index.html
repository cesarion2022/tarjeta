<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Cesar Díaz · Tarjeta digital</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{
  --bg:#070a16; --panel:#0c1226; --cyan:#22e4ff; --mag:#ff3d8b; --ochre:#ffb52e; --txt:#e8f1ff; --dim:#8a99b8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px;overflow-x:hidden}
#net{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.scene,.controls{position:relative;z-index:1}
.scene{width:min(92vw,460px);aspect-ratio:1.45;perspective:1400px;
  transform:rotateX(var(--tx,0deg)) rotateY(var(--ty,0deg));transition:transform .15s ease-out;transform-style:preserve-3d}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.9,.2,1);
  cursor:pointer;border:0;padding:0;background:none;display:block;text-align:left;color:inherit;font:inherit}
.card.flipped{transform:rotateY(180deg)}
.card:focus-visible{outline:3px solid var(--cyan);outline-offset:8px;border-radius:20px}
.face{position:absolute;inset:0;border-radius:18px;padding:2px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:conic-gradient(from var(--ang),var(--cyan),var(--mag),var(--ochre),var(--cyan));
  animation:spin 5s linear infinite;box-shadow:0 0 36px rgba(34,228,255,.28),0 0 70px rgba(255,61,139,.14)}
.back{transform:rotateY(180deg)}
@keyframes spin{to{--ang:360deg}}
.in{position:relative;height:100%;border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#0e1730,var(--panel) 60%,#0a0f20);padding:7%;display:flex;flex-direction:column}
.in::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px)}
.in::after{content:"";position:absolute;left:0;right:0;height:60px;top:-60px;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(34,228,255,.16),transparent);animation:scan 4.5s linear infinite}
@keyframes scan{to{top:110%}}
.chip{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;font:600 12px "JetBrains Mono",monospace;color:var(--cyan);
  border:1px solid rgba(34,228,255,.4);border-radius:999px;padding:5px 11px}
.dot{width:8px;height:8px;border-radius:50%;background:#3dff9a;box-shadow:0 0 0 0 rgba(61,255,154,.7);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(61,255,154,0)}100%{box-shadow:0 0 0 0 rgba(61,255,154,0)}}
h1{margin:auto 0 6px;font:700 clamp(32px,9.5vw,52px)/1 "Space Grotesk",sans-serif;letter-spacing:-.02em;
  background:linear-gradient(90deg,var(--txt),var(--cyan) 60%,var(--mag));background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s ease-in-out infinite alternate}
@keyframes flow{to{background-position:100% 0}}
.role{margin:0;min-height:1.5em;font:400 clamp(12px,3.3vw,15px) "JetBrains Mono",monospace;color:var(--ochre)}
.caret{display:inline-block;width:.55em;height:1em;background:var(--ochre);vertical-align:-.15em;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tap{margin-top:12px;font:400 11px "JetBrains Mono",monospace;color:var(--dim)}
h2{margin:0 0 8px;font:600 13px "JetBrains Mono",monospace;color:var(--cyan)}
.list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;position:relative;z-index:1}
.list li{min-width:0}.list li.wide{grid-column:1/-1}
.list a{display:flex;align-items:center;gap:8px;min-height:30px;padding:4px 8px;border-radius:8px;color:var(--txt);text-decoration:none;
  font:400 clamp(11px,2.9vw,13px) "JetBrains Mono",monospace;border:1px solid transparent;transition:border-color .2s,background .2s,transform .2s}
.list a:hover,.list a:focus-visible{background:rgba(34,228,255,.1);border-color:rgba(34,228,255,.5);transform:translateX(3px);outline:none}
.list svg{width:17px;height:17px;flex:none;fill:var(--cyan)}
.list li:nth-child(even) svg{fill:var(--mag)}
.list span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .wide span{white-space:normal;overflow:visible}
.controls{display:flex;gap:10px}
.controls button{font:600 13px "JetBrains Mono",monospace;color:var(--txt);background:rgba(12,18,38,.8);border:1px solid rgba(34,228,255,.5);
  border-radius:999px;padding:9px 16px;cursor:pointer;transition:box-shadow .2s}
.controls button:hover{box-shadow:0 0 16px rgba(34,228,255,.5)}
.controls button:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}
.controls button[aria-pressed="true"]{background:var(--cyan);color:#041018}
@media (prefers-reduced-motion:reduce){.face,.in::after,h1,.dot,.caret{animation:none}.card,.scene{transition:none}}
</style>
</head>
<body>

<div class="controls">
  <button id="flip" type="button">Girar</button>
  <button id="spin" type="button" aria-pressed="false">Giro automático</button>
</div>
<script>
(function(){
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var card=document.getElementById('card'),scene=document.getElementById('scene'),timer=null;
  function flip(){card.classList.toggle('flipped');}
  card.addEventListener('click',function(e){if(!e.target.closest('a'))flip();});
  document.getElementById('flip').addEventListener('click',flip);
  var spin=document.getElementById('spin');
  spin.addEventListener('click',function(){
    var on=spin.getAttribute('aria-pressed')!=='true';
    spin.setAttribute('aria-pressed',on);
    spin.textContent=on?'Detener giro':'Giro automático';
    clearInterval(timer);if(on)timer=setInterval(flip,3500);
  });
  // inclinación 3D con el puntero
  if(!reduce){
    addEventListener('pointermove',function(e){
      var r=scene.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      scene.style.setProperty('--ty',(x*14).toFixed(1)+'deg');
      scene.style.setProperty('--tx',(-y*14).toFixed(1)+'deg');
    });
  }
  // texto que se escribe
  var words=['Tecnología','Desarrollo web','Wayuu colombiano'],t=document.getElementById('typed'),w=0,c=0,del=false;
  if(reduce){t.textContent=words.join(' / ');}
  else(function type(){
    var s=words[w];c+=del?-1:1;t.textContent=s.slice(0,c);
    var d=del?35:80;
    if(!del&&c===s.length){del=true;d=1400;}
    else if(del&&c===0){del=false;w=(w+1)%words.length;d=300;}
    setTimeout(type,d);
  })();
  // red de partículas
  var cv=document.getElementById('net'),g=cv.getContext('2d'),P=[],W,H;
  function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;
    var n=Math.min(70,Math.round(W*H/16000));P=[];
    for(var i=0;i<n;i++)P.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5});}
  size();addEventListener('resize',size);
  function draw(){
    g.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){
      var a=P[i];
      if(!reduce){a.x+=a.vx;a.y+=a.vy;if(a.x<0||a.x>W)a.vx*=-1;if(a.y<0||a.y>H)a.vy*=-1;}
      g.fillStyle='rgba(34,228,255,.8)';g.fillRect(a.x,a.y,2,2);
      for(var j=i+1;j<P.length;j++){
        var b=P[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;
        if(d<16000){g.strokeStyle='rgba(34,228,255,'+(.22*(1-d/16000)).toFixed(3)+')';g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();}
      }
    }
    if(!reduce)requestAnimationFrame(draw);
  }
  draw();
})();
</script>
